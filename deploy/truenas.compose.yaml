# Rendered by deploy.sh (values come from deploy/.env) and installed as the TrueNAS custom app
# "agent-runner". Container user is uid/gid 950 = truenas_admin, so the bind mounts stay manageable
# over SSH (sudo needs a password on this box).
services:
  worker:
    image: ghcr.io/derekhearst/agent-runner-worker:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      ANTHROPIC_ENVIRONMENT_KEY: "${ANTHROPIC_ENVIRONMENT_KEY}"
      ANTHROPIC_ENVIRONMENT_ID: "${ANTHROPIC_ENVIRONMENT_ID}"
      GH_TOKEN: "${GH_TOKEN}"
      GIT_NAME: "${GIT_NAME}"
      GIT_EMAIL: "${GIT_EMAIL}"
    volumes:
      - /mnt/Apps/Apps/AgentRunner/workspace:/workspace
      - /mnt/Apps/Apps/AgentRunner/rfs-tools:/opt/rfs
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 2048
    mem_limit: ${WORKER_MEM_LIMIT}

  # Interactive dev box on the same image: unprivileged sshd on 2222, Claude Code in a persistent home,
  # and the GPU shared with lifelog and Plex through the NVIDIA runtime. No agent secrets in here, so a
  # shell in this container cannot reach the worker's tokens.
  devbox:
    image: ghcr.io/derekhearst/agent-runner-worker:latest
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/devbox-entrypoint.sh"]
    environment:
      SSH_AUTHORIZED_KEYS: "${SSH_AUTHORIZED_KEYS}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video,graphics
    ports:
      - "${DEVBOX_SSH_PORT}:2222"
    volumes:
      - /mnt/Apps/Apps/AgentRunner/devhome:/home/agent
      - /mnt/Apps/Apps/AgentRunner/rfs-tools:/opt/rfs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 4096
    mem_limit: ${DEVBOX_MEM_LIMIT}

  # Separate container so the API key below is never in the worker the agent runs commands in.
  dispatcher:
    image: ghcr.io/derekhearst/agent-runner-worker:latest
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["/opt/venv/bin/python", "-u", "/opt/dispatch.py"]
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      GH_TOKEN: "${GH_TOKEN}"
      AGENT_ID: "agent_0174fxsaSGLdcmwxcNkaBb14"
      ENVIRONMENT_ID: "${ANTHROPIC_ENVIRONMENT_ID}"
      BUDGET_USD: "${BUDGET_USD}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
