# Rendered by deploy.sh (values come from deploy/.env) and installed as the TrueNAS custom app
# "agent-runner". Container user is uid/gid 950 = truenas_admin, so the bind mounts stay manageable
# over SSH (sudo needs a password on this box).
services:
  # The dev box: unprivileged sshd on 2222, Claude Code in a persistent home, the GPU shared with
  # lifelog and Plex through the NVIDIA runtime, and the issue agent's sandbox worker, all under one
  # memory cap. The worker's tokens are not in SSH or Remote Control shells' environment, but the
  # same user can read the worker process's, so treat a shell here as able to reach them.
  devbox:
    image: ghcr.io/derekhearst/agent-runner-worker:latest
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/devbox-entrypoint.sh"]
    environment:
      SSH_AUTHORIZED_KEYS: "${SSH_AUTHORIZED_KEYS}"
      # The issue agent's worker runs in here too, so both share the one memory cap. The
      # entrypoint hands these to the worker alone and drops them before sshd starts.
      ANTHROPIC_ENVIRONMENT_KEY: "${ANTHROPIC_ENVIRONMENT_KEY}"
      ANTHROPIC_ENVIRONMENT_ID: "${ANTHROPIC_ENVIRONMENT_ID}"
      GH_TOKEN: "${GH_TOKEN}"
      GIT_NAME: "${GIT_NAME}"
      GIT_EMAIL: "${GIT_EMAIL}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video,graphics
    ports:
      - "${DEVBOX_SSH_PORT}:2222"
    volumes:
      - /mnt/Apps/Apps/AgentRunner/devhome:/home/agent
      - /mnt/Apps/Apps/AgentRunner/rfs-tools:/opt/rfs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 4096
    mem_limit: ${DEVBOX_MEM_LIMIT}

  # Separate container so the API key below is never where the agent runs commands.
  dispatcher:
    image: ghcr.io/derekhearst/agent-runner-worker:latest
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["/opt/venv/bin/python", "-u", "/opt/dispatch.py"]
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      GH_TOKEN: "${GH_TOKEN}"
      AGENT_ID: "agent_0174fxsaSGLdcmwxcNkaBb14"
      ENVIRONMENT_ID: "${ANTHROPIC_ENVIRONMENT_ID}"
      BUDGET_USD: "${BUDGET_USD}"
      # Hourly usage report to the usage dashboard (source "agent-runner"); off while empty.
      CLAUDE_STATS_TOKEN: "${CLAUDE_STATS_TOKEN}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
