name: Worker image
# Builds the self-hosted sandbox worker and publishes it to ghcr.io so the TrueNAS custom app can
# pull it (the box has no usable docker CLI). The image holds no secrets; they come from the app's
# environment at runtime.
on:
  push:
    branches: [main]
    paths: [worker/**, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/agent-runner-worker:latest
